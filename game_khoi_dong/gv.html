<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Giao Diện (GV)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .team-answer-indicator.answered { background-color: #2ecc71; border-color: #2ecc71; }
        .score-box.pulse { animation: pulse-animation 0.5s ease-in-out; }
        @keyframes pulse-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .game-screen { display: none; }
        .game-screen.active { display: flex; }
    </style>
    
    <script type="module">
        // --- ĐÃ THÊM firebaseConfig CỦA BẠN ---
        const firebaseConfig = {
            apiKey: "AIzaSyCeKHAaY58XKouzucFq9NJuKSD5oZI0Yyw",
            authDomain: "khoidog12c3.firebaseapp.com",
            projectId: "khoidog12c3",
            storageBucket: "khoidog12c3.firebasestorage.app",
            messagingSenderId: "177773503964",
            appId: "1:177773503964:web:3986f366bba3d3e6909b19",
            measurementId: "G-WFHZ5RXYL4"
        };
        // -----------------------------------------------------------

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, getDocs, deleteDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth).catch((error) => console.error("Lỗi đăng nhập GV:", error));

        // --- ID PHÒNG CỐ ĐỊNH ---
        const GAME_ID = "active_game_room"; 
        
        // --- CSDL CÂU HỎI (Giữ nguyên) ---
        const questions = [
            { type: 'MCQ', text: 'Cho $\\vec{a} = (1; 2; 3)$ và $\\vec{b} = (3; -1; 1)$. Tính $\\vec{a} + \\vec{b}$.', options: ['A. (4; 1; 4)', 'B. (4; 2; 4)', 'C. (2; 1; 2)', 'D. (-2; 3; 2)'], answer: 'A', answer_display: '(4; 1; 4)' },
            { type: 'FILL', text: 'Cho $\\vec{u} = (2; -1)$ và $\\vec{v} = (3; 4)$. Tính $\\vec{u} \\cdot \\vec{v}$.', answer: '2', answer_display: '2' },
            { type: 'MCQ', text: 'Cho $\\vec{c} = (3; -4)$. Tính độ dài của vector $2\\vec{c}$.', options: ['A. 5', 'B. 10', 'C. 7', 'D. 14'], answer: 'B', answer_display: '10' },
            { type: 'FILL', text: 'Cho $A(1; 1)$ và $B(4; 5)$. Tìm $\\vec{AB}$. (Nhập `(x;y)`)', answer: '(3;4)', answer_display: '(3; 4)' }
        ];
        const TOTAL_QUESTIONS = questions.length;

        // --- BIẾN TOÀN CỤC ---
        let currentQuestionIndex = -1;
        let gameId = GAME_ID; // Gán ID cố định
        let questionStartTime;
        let timerInterval;
        let playerListener = null;
        let answerListener = null;

        // --- DOM Elements ---
        const screens = {};
        const scoreDisplays = {};
        const scoreBoxes = {};
        const lobbyTeams = {};
        const answeredIndicators = {};

        // Hàm tiện ích
        function getEl(id) { return document.getElementById(id); }
        function showScreen(screenId) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            if (screens[screenId]) screens[screenId].classList.add('active');
        }

        // --- HÀM CHÍNH CỦA TRÒ CHƠI ---

        async function createNewGame() {
            // Đặt lại các ô chờ
            Object.values(lobbyTeams).forEach(teamEl => {
                const teamName = teamEl.id.split('-')[2]; // 'lobby-team-green' -> 'green'
                teamEl.textContent = `Đội ${teamName.charAt(0).toUpperCase() + teamName.slice(1)} (Chờ...)`;
                teamEl.className = "p-4 border-2 border-dashed border-gray-600 rounded-lg";
            });

            try {
                // 1. Tạo (hoặc GHI ĐÈ) phòng game cố định
                const gameRef = doc(db, "games", gameId);
                await setDoc(gameRef, {
                    status: 'lobby', // Trạng thái: phòng chờ
                    currentQuestion: -1,
                    scores: { green: 0, red: 0, orange: 0, purple: 0 },
                    createdAt: serverTimestamp()
                });

                // 2. Bắt đầu lắng nghe xem có ai vào phòng không
                listenForPlayers();
                
                showScreen('lobby');
                console.log(`[GV] Đã tạo/reset phòng: ${gameId}`);
            } catch (e) {
                console.error("Lỗi tạo phòng:", e);
                alert("Không thể tạo phòng. Vui lòng kiểm tra `firebaseConfig` và Quy tắc Bảo mật Firestore (đã ở chế độ test chưa).");
            }
        }
        
        // Lắng nghe người chơi tham gia
        function listenForPlayers() {
            if (playerListener) playerListener(); // Hủy listener cũ
            
            const playersRef = collection(db, "games", gameId, "players");
            playerListener = onSnapshot(playersRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const team = change.doc.id; // 'green', 'red', ...
                        console.log(`[GV] Đội ${team} đã tham gia.`);
                        if (lobbyTeams[team]) {
                            lobbyTeams[team].textContent = `Đội ${team.charAt(0).toUpperCase() + team.slice(1)} (Đã vào)`;
                            lobbyTeams[team].className = "p-4 bg-green-700 rounded-lg";
                        }
                    }
                });
            });
        }
        
        // Bắt đầu trò chơi
        async function startGame() {
            if (playerListener) playerListener(); // Dừng lắng nghe người chơi
            currentQuestionIndex = 0;
            await loadQuestion();
        }

        // Tải câu hỏi
        async function loadQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                return await endGame();
            }

            // Reset chỉ báo trả lời
            Object.values(answeredIndicators).forEach(ind => ind.classList.remove('answered'));

            const q = questions[currentQuestionIndex];
            
            getEl('question-number').textContent = `Câu ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            getEl('question-text').innerHTML = q.text;
            
            const optionsEl = getEl('question-options');
            optionsEl.innerHTML = '';
            if (q.type === 'MCQ') {
                const colors = ['bg-red-600', 'bg-blue-600', 'bg-yellow-500', 'bg-green-600'];
                q.options.forEach((option, index) => {
                    optionsEl.innerHTML += `<div class="${colors[index]} p-6 rounded-lg text-3xl font-bold">${option}</div>`;
                });
            } else {
                optionsEl.innerHTML = `<div class="col-span-2 bg-gray-700 p-6 rounded-lg text-3xl font-bold">ĐIỀN VÀO Ô TRỐNG</div>`;
            }

            if (window.MathJax) MathJax.typesetPromise();
            showScreen('question');
            
            // Bắt đầu lắng nghe câu trả lời
            listenForAnswers();

            // Cập nhật trạng thái lên Firebase
            questionStartTime = Date.now();
            await updateDoc(doc(db, "games", gameId), {
                status: 'question',
                currentQuestion: currentQuestionIndex,
                questionText: q.text,
                questionType: q.type,
                questionStartTime: questionStartTime
            });

            startTimer(30);
        }

        // Lắng nghe câu trả lời từ HS
        function listenForAnswers() {
            if (answerListener) answerListener();
            
            const answersRef = collection(db, "games", gameId, `answers_${currentQuestionIndex}`);
            answerListener = onSnapshot(answersRef, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const team = change.doc.id; // 'green', 'red', ...
                        console.log(`[GV] Đội ${team} đã trả lời.`);
                        if (answeredIndicators[team]) {
                            answeredIndicators[team].classList.add('answered');
                        }
                    }
                });
            });
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            let timeLeft = duration;
            getEl('timer').textContent = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                getEl('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    window.showAnswer(); // Tự động hiển thị đáp án khi hết giờ
                }
            }, 1000);
        }

        // Hiển thị đáp án và tính điểm
        window.showAnswer = async function() {
            clearInterval(timerInterval);
            if (answerListener) answerListener(); // Dừng nghe trả lời

            const q = questions[currentQuestionIndex];
            getEl('answer-text').textContent = q.answer_display;

            const answersRef = collection(db, "games", gameId, `answers_${currentQuestionIndex}`);
            const answerSnapshot = await getDocs(answersRef);
            
            const teamAnswers = [];
            answerSnapshot.forEach(doc => {
                teamAnswers.push({ team: doc.id, ...doc.data() });
            });

            let currentScores = { green: 0, red: 0, orange: 0, purple: 0 };
            const gameDoc = await getDoc(doc(db, "games", gameId));
            if (gameDoc.exists()) {
                currentScores = gameDoc.data().scores;
            }

            let fastestTime = Infinity;
            let fastestCorrectTeam = null;

            teamAnswers.forEach(ans => {
                let isCorrect;
                const normalize = (str) => (str || "").replace(/[() ]/g, '').toLowerCase();

                if (q.type === 'MCQ') {
                    isCorrect = ans.answer.toUpperCase() === q.answer.toUpperCase();
                } else {
                    isCorrect = normalize(ans.answer) === normalize(q.answer);
                }

                if (isCorrect) {
                    const timeTaken = ans.timestamp - questionStartTime;
                    const scoreGained = Math.max(50, 300 - Math.floor(timeTaken / 1000) * 10);
                    currentScores[ans.team] += scoreGained;
                    
                    if (timeTaken < fastestTime) {
                        fastestTime = timeTaken;
                        fastestCorrectTeam = ans.team;
                    }
                    
                    scoreBoxes[ans.team].classList.add('pulse');
                    setTimeout(() => scoreBoxes[ans.team].classList.remove('pulse'), 500);
                }
            });

            if (fastestCorrectTeam) {
                getEl('fastest-team').textContent = `Đội ${fastestCorrectTeam.charAt(0).toUpperCase() + fastestCorrectTeam.slice(1)} nhanh nhất!`;
            } else {
                getEl('fastest-team').textContent = "Không có đội nào trả lời đúng!";
            }
            
            updateScoreboard(currentScores);
            showScreen('answer');

            await updateDoc(doc(db, "games", gameId), {
                status: 'answer',
                scores: currentScores,
                correctAnswer: q.answer_display
            });
        }

        function updateScoreboard(scores) {
            Object.keys(scores).forEach(team => {
                if(scoreDisplays[team]) scoreDisplays[team].textContent = scores[team];
            });
        }

        async function endGame() {
            clearInterval(timerInterval);
            
            const gameDoc = await getDoc(doc(db, "games", gameId));
            let finalScores;
            if (gameDoc.exists()) {
                finalScores = gameDoc.data().scores;
            } else {
                console.error("Không tìm thấy game doc để kết thúc!");
                return;
            }

            const sortedScores = Object.entries(finalScores).sort((a, b) => b[1] - a[1]);
            const [winner, maxScore] = sortedScores[0];
            
            getEl('winner-team').textContent = `${winner.charAt(0).toUpperCase() + winner.slice(1)} (với ${maxScore} điểm)`;
            getEl('final-scores').innerHTML = sortedScores.map((entry, index) => {
                const teamName = entry[0];
                const teamScore = entry[1];
                return `<p>${index + 1}. Đội ${teamName.charAt(0).toUpperCase() + teamName.slice(1)}: ${teamScore} điểm</p>`;
            }).join('');
            
            showScreen('end');
            
            await updateDoc(doc(db, "games", gameId), {
                status: 'end'
            });
        }

        // --- GẮN SỰ KIỆN ---
        window.onload = () => {
            // Gán các DOM element
            Object.assign(screens, {
                lobby: getEl('screen-lobby'),
                question: getEl('screen-question'),
                answer: getEl('screen-answer'),
                end: getEl('screen-end')
            });
            Object.assign(scoreDisplays, {
                green: getEl('score-green'), red: getEl('score-red'), orange: getEl('score-orange'), purple: getEl('score-purple')
            });
            Object.assign(scoreBoxes, {
                green: getEl('score-box-green'), red: getEl('score-box-red'), orange: getEl('score-box-orange'), purple: getEl('score-box-purple')
            });
            Object.assign(lobbyTeams, {
                green: getEl('lobby-team-green'), red: getEl('lobby-team-red'), orange: getEl('lobby-team-orange'), purple: getEl('lobby-team-purple')
            });
            Object.assign(answeredIndicators, {
                green: getEl('answered-green'), red: getEl('answered-red'), orange: getEl('answered-orange'), purple: getEl('answered-purple')
            });

            // Gắn nút bấm
            getEl('btn-start').addEventListener('click', startGame);
            getEl('btn-next-question').addEventListener('click', () => {
                currentQuestionIndex++;
                loadQuestion();
            });
            getEl('btn-restart').addEventListener('click', createNewGame);
            getEl('btn-show-answer').addEventListener('click', window.showAnswer);

            // Bắt đầu
            createNewGame();
        };

        // Cần cho MathJax
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };

    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

</head>
<body class="h-full flex flex-col items-center justify-center p-4 bg-gray-900 text-white">

    <div class="w-full max-w-7xl mx-auto mb-4">
        <h1 class="text-4xl font-bold text-center mb-6">VECTOR QUIZ (Firebase)</h1>
        <div class="grid grid-cols-4 gap-4 text-center">
            <div id="score-box-green" class="score-box bg-green-600 p-4 rounded-lg shadow-lg">
                <h2 class="text-2xl font-bold">Đội Xanh Lá</h2>
                <span id="score-green" class="text-5xl font-bold">0</span>
            </div>
            <div id="score-box-red" class="score-box bg-red-600 p-4 rounded-lg shadow-lg">
                <h2 class="text-2xl font-bold">Đội Đỏ</h2>
                <span id="score-red" class="text-5xl font-bold">0</span>
            </div>
            <div id="score-box-orange" class="score-box bg-orange-500 p-4 rounded-lg shadow-lg">
                <h2 class="text-2xl font-bold">Đội Cam</h2>
                <span id="score-orange" class="text-5xl font-bold">0</span>
            </div>
            <div id="score-box-purple" class="score-box bg-purple-600 p-4 rounded-lg shadow-lg">
                <h2 class="text-2xl font-bold">Đội Tím</h2>
                <span id="score-purple" class="text-5xl font-bold">0</span>
            </div>
        </div>
    </div>

    <div id="game-container" class="w-full max-w-7xl mx-auto h-[65vh] bg-gray-800 rounded-lg shadow-2xl p-8 flex items-center justify-center text-center relative">

        <div id="screen-lobby" class="game-screen active flex-col w-full">
            <h2 class="text-4xl font-bold mb-6">Sẵn sàng tham gia!</h2>
            <p class="text-2xl mb-8">Học sinh hãy mở file `HS.html` và chọn đội.</p>
            
            <div class="flex gap-4 justify-center my-8">
                <div id="lobby-team-green" class="p-4 border-2 border-dashed border-gray-600 rounded-lg">Đội Xanh Lá (Chờ...)</div>
                <div id="lobby-team-red" class="p-4 border-2 border-dashed border-gray-600 rounded-lg">Đội Đỏ (Chờ...)</div>
                <div id="lobby-team-orange" class="p-4 border-2 border-dashed border-gray-600 rounded-lg">Đội Cam (Chờ...)</div>
                <div id="lobby-team-purple" class="p-4 border-2 border-dashed border-gray-600 rounded-lg">Đội Tím (Chờ...)</div>
            </div>

            <button id="btn-start" class="py-3 px-6 bg-blue-600 hover:bg-blue-700 text-2xl font-bold rounded-lg">BẮT ĐẦU</button>
        </div>

        <div id="screen-question" class="game-screen flex-col w-full">
            <div id="timer" class="absolute top-4 right-4 bg-white text-gray-900 text-3xl font-bold w-20 h-20 rounded-full flex items-center justify-center">30</div>
            <div class="absolute top-4 left-4 flex gap-2">
                <div id="answered-green" class="team-answer-indicator w-10 h-10 rounded-full bg-gray-600 border-2 border-white" title="Đội Xanh Lá"></div>
                <div id="answered-red" class="team-answer-indicator w-10 h-10 rounded-full bg-gray-600 border-2 border-white" title="Đội Đỏ"></div>
                <div id="answered-orange" class="team-answer-indicator w-10 h-10 rounded-full bg-gray-600 border-2 border-white" title="Đội Cam"></div>
                <div id="answered-purple" class="team-answer-indicator w-10 h-10 rounded-full bg-gray-600 border-2 border-white" title="Đội Tím"></div>
            </div>
            <h2 id="question-number" class="text-2xl font-light mb-4">...</h2>
            <div id="question-text" class="text-5xl font-bold mb-6 min-h-[150px]">...</div>
            <div id="question-options" class="grid grid-cols-2 gap-4 w-full max-w-4xl mx-auto"></div>
             <button id="btn-show-answer" class="absolute bottom-4 right-4 py-2 px-4 bg-yellow-600 hover:bg-yellow-700 text-lg font-bold rounded-lg">Hiện Đáp Án</button>
        </div>
        
        <div id="screen-answer" class="game-screen flex-col w-full">
            <h2 class="text-3xl font-bold mb-6">ĐÁP ÁN ĐÚNG LÀ:</h2>
            <div id="answer-text" class="text-6xl font-bold text-green-400 mb-8">...</div>
            <p class="text-xl mb-4" id="fastest-team">...</p>
            <button id="btn-next-question" class="py-3 px-6 bg-blue-600 hover:bg-blue-700 text-2xl font-bold rounded-lg mt-8">CÂU HỎI TIẾP THEO</button>
        </div>

        <div id="screen-end" class="game-screen flex-col w-full">
            <h2 class="text-4xl font-bold mb-8">TRÒ CHƠI KẾT THÚC!</h2>
            <h3 class="text-3xl font-bold text-yellow-400 mb-4">Chúc mừng ĐỘI <span id="winner-team">...</span>!</h3>
            <div id="final-scores" class="text-xl mt-4"></div>
            <button id="btn-restart" class="py-3 px-6 bg-blue-600 hover:bg-blue-700 text-2xl font-bold rounded-lg mt-8">CHƠI LẠI</button>
        </div>
    </div>

</body>
</html>
