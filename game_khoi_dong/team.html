<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Team – Quiz Toán 12 (Vectơ & tọa độ Oxyz)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0, #000 60%);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      margin: 10px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: linear-gradient(135deg, #020617, #020617, #0f172a);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    header {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }
    .title { font-size:16px; font-weight:600; }
    .subtitle { font-size:12px; color:#9ca3af; }
    .pill {
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.5);
    }
    main {
      padding:10px;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .card {
      border-radius:14px;
      border:1px solid rgba(148,163,184,0.4);
      background:rgba(15,23,42,0.95);
      padding:12px;
    }
    .team-select-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .team-btn {
      border-radius:12px;
      padding:10px;
      border:none;
      color:#0b1120;
      font-weight:600;
      cursor:pointer;
      font-size:14px;
    }
    .team-green{ background:#22c55e; }
    .team-red{ background:#ef4444; }
    .team-orange{ background:#f97316; }
    .team-purple{ background:#a855f7; }

    .label { font-size:12px; color:#9ca3af; margin-bottom:4px; }
    .input {
      width:100%;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid rgba(148,163,184,0.6);
      background:#020617;
      color:#e5e7eb;
      font-size:14px;
      outline:none;
    }
    .input:focus {
      border-color:rgba(56,189,248,0.9);
      box-shadow:0 0 0 1px rgba(56,189,248,0.7);
    }
    .btn-primary {
      margin-top:10px;
      width:100%;
      border-radius:999px;
      border:none;
      padding:9px 12px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      border:1px solid rgba(74,222,128,0.9);
      color:#022c22;
    }
    .btn-primary:disabled {
      opacity:0.4;
      cursor:default;
    }

    .question-info {
      font-size:12px;
      color:#9ca3af;
      display:flex;
      justify-content:space-between;
      margin-bottom:6px;
    }
    .question-main {
      font-size:16px;
      line-height:1.5;
      min-height:40px;
    }
    .options {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      margin-top:10px;
    }
    .option-btn {
      border-radius:12px;
      border:1px solid rgba(148,163,184,0.5);
      background:#020617;
      color:#e5e7eb;
      padding:8px 10px;
      font-size:14px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .option-btn.selected {
      border-color:rgba(56,189,248,0.9);
      box-shadow:0 0 0 1px rgba(56,189,248,0.8);
    }
    .option-label {
      width:22px;
      height:22px;
      border-radius:8px;
      border:1px solid rgba(148,163,184,0.7);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
    }
    .status-row {
      font-size:12px;
      color:#9ca3af;
      margin-top:6px;
    }
    .feedback {
      margin-top:6px;
      font-size:13px;
    }
    .score-label {
      font-size:13px;
      font-weight:500;
    }
    .btn-submit {
      margin-top:8px;
      width:100%;
      border-radius:999px;
      border:none;
      padding:9px 12px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      border:1px solid rgba(74,222,128,0.9);
      color:#022c22;
    }
    .btn-submit:disabled { opacity:0.4; cursor:default; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="title">Team – Vectơ & tọa độ Oxyz</div>
      <div class="subtitle" id="teamNameLabel">Chưa chọn đội</div>
    </div>
    <div>
      <span class="pill" id="connectStatus">Đang kết nối...</span>
    </div>
  </header>

  <main>
    <section class="card" id="teamSelectCard">
      <div class="label">1. Chọn màu đội</div>
      <div class="team-select-grid">
        <button class="team-btn team-green" data-team="green">Đội Xanh</button>
        <button class="team-btn team-red" data-team="red">Đội Đỏ</button>
        <button class="team-btn team-orange" data-team="orange">Đội Cam</button>
        <button class="team-btn team-purple" data-team="purple">Đội Tím</button>
      </div>
      <div style="margin-top:10px;">
        <div class="label">2. Nhập tên đội (lớp/nhóm)</div>
        <input id="nicknameInput" class="input" placeholder="Ví dụ: 12A1 - Nhóm 1">
      </div>
      <button id="joinBtn" class="btn-primary">Vào chơi</button>
    </section>

    <section class="card" id="gameCard" style="display:none;">
      <div class="question-info">
        <div>Câu: <strong id="qIndexLabel">- / 12</strong></div>
        <div>Điểm: <span class="score-label" id="scoreLabel">0</span></div>
      </div>
      <div class="question-main" id="qText">Đang chờ giáo viên bắt đầu câu hỏi...</div>
      <div id="mcqBox" class="options" style="display:none;"></div>
      <div id="fillBox" style="display:none;margin-top:8px;">
        <input id="fillInput" class="input" placeholder="Nhập đáp án, ví dụ: (2;-3;5)">
      </div>
      <button id="submitBtn" class="btn-submit" disabled>Gửi đáp án</button>
      <div class="status-row" id="statusRow">Chưa có câu hỏi.</div>
      <div class="feedback" id="feedbackBox"></div>
    </section>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import {
    getDatabase,
    ref,
    onValue,
    set,
    get,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeKHAaY58XKouzucFq9NJuKSD5oZI0Yyw",
    authDomain: "khoidog12c3.firebaseapp.com",
    projectId: "khoidog12c3",
    storageBucket: "khoidog12c3.firebasestorage.app",
    messagingSenderId: "177773503964",
    appId: "1:177773503964:web:3986f366bba3d3e6909b19",
    measurementId: "G-WFHZ5RXYL4"
  // 👉 THÊM DÒNG NÀY:
  databaseURL: "https://khoidog12c3-default-rtdb.asia-southeast1.firebasedatabase.app"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const questions = [
    {
      type: "mcq",
      text: "Câu 1. Trong không gian Oxyz, cho A(1;2;3), B(4;0;-1). Tọa độ vectơ AB là:",
      options: [
        "(3; -2; -4)",
        "(-3; 2; 4)",
        "(3; 2; 4)",
        "(4; 2; 3)"
      ],
      correctOptionIndex: 0
    },
    {
      type: "fill",
      text: "Câu 2. Trong không gian Oxyz, cho A(2; -1; 3), B(-1; 4; 0). Tọa độ vectơ BA là:",
      answerPatterns: ["(3;-5;3)", "3;-5;3", "(3; -5; 3)", "3; -5; 3"]
    },
    {
      type: "mcq",
      text: "Câu 3. Vectơ nào sau đây cùng hướng với vectơ u = (2; -1; 4)?",
      options: [
        "(1; -0,5; 2)",
        "(-2; 1; -4)",
        "(-1; 0,5; -2)",
        "(-4; 2; -8)"
      ],
      correctOptionIndex: 0
    },
    {
      type: "fill",
      text: "Câu 4. Cho vectơ u = (1; 2; -3). Tọa độ vectơ 2u là:",
      answerPatterns: ["(2;4;-6)", "2;4;-6", "(2; 4; -6)", "2; 4; -6"]
    },
    {
      type: "mcq",
      text: "Câu 5. Trong không gian Oxyz, cho A(1;0;2), C(0;2;1). Tọa độ vectơ AC là:",
      options: [
        "(-1; 2; -1)",
        "(-1; -2; -1)",
        "(1; 2; 1)",
        "(0; 2; 1)"
      ],
      correctOptionIndex: 0
    },
    {
      type: "fill",
      text: "Câu 6. Cho a = (2; -1; 3), b = (-1; 4; 0). Tọa độ vectơ a + b là:",
      answerPatterns: ["(1;3;3)", "1;3;3", "(1; 3; 3)", "1; 3; 3"]
    },
    {
      type: "mcq",
      text: "Câu 7. Cho vectơ u = (x; y; z). Điều kiện cần và đủ để u là vectơ không là:",
      options: [
        "x = y = z",
        "x + y + z = 0",
        "x = y = z = 0",
        "Không đồng thời x, y, z đều bằng 0"
      ],
      correctOptionIndex: 3
    },
    {
      type: "fill",
      text: "Câu 8. Cho u = (1; -2; 3), v = (2; 1; -1). Tọa độ vectơ u - v là:",
      answerPatterns: ["(-1;-3;4)", "-1;-3;4", "(-1; -3; 4)", "-1; -3; 4"]
    },
    {
      type: "mcq",
      text: "Câu 9. Cho A(0;1;2), B(2;3;4), C(1;2;3). Khẳng định nào đúng?",
      options: [
        "AB = (2; 2; 2)",
        "AC = (1; 1; 1)",
        "BC = (-1; -1; -1)",
        "Cả B) và C) đều đúng"
      ],
      correctOptionIndex: 3
    },
    {
      type: "fill",
      text: "Câu 10. Cho A(1;2;3), B(3;0;5). Tọa độ trung điểm M của đoạn AB là:",
      answerPatterns: ["(2;1;4)", "2;1;4", "(2; 1; 4)", "2; 1; 4"]
    },
    {
      type: "mcq",
      text: "Câu 11. Cho u = (1;2;0), v = (0;1;3). Tọa độ vectơ 2u + v là:",
      options: [
        "(1; 4; 3)",
        "(2; 3; 3)",
        "(2; 5; 3)",
        "(0; 4; 3)"
      ],
      correctOptionIndex: 2
    },
    {
      type: "fill",
      text: "Câu 12. Cho u = (2; -1; 4). Tọa độ vectơ đối của u (tức là -u) là:",
      answerPatterns: ["(-2;1;-4)", "-2;1;-4", "(-2; 1; -4)", "-2; 1; -4"]
    }
  ];

  const connectStatus = document.getElementById("connectStatus");
  const teamNameLabel = document.getElementById("teamNameLabel");
  const teamSelectCard = document.getElementById("teamSelectCard");
  const gameCard = document.getElementById("gameCard");
  const nicknameInput = document.getElementById("nicknameInput");
  const joinBtn = document.getElementById("joinBtn");

  const qIndexLabel = document.getElementById("qIndexLabel");
  const qText = document.getElementById("qText");
  const mcqBox = document.getElementById("mcqBox");
  const fillBox = document.getElementById("fillBox");
  const fillInput = document.getElementById("fillInput");
  const submitBtn = document.getElementById("submitBtn");
  const statusRow = document.getElementById("statusRow");
  const feedbackBox = document.getElementById("feedbackBox");
  const scoreLabel = document.getElementById("scoreLabel");

  let chosenTeam = null;
  let currentQuestionIndex = -1;
  let currentQuestionType = null;
  let selectedOptionIndex = null;
  let questionStartTime = null;

  const params = new URLSearchParams(window.location.search);
  const urlTeam = params.get("team");
  if (urlTeam) chosenTeam = urlTeam;

  function normalizeAnswer(str) {
    if (!str) return "";
    return str.trim().toLowerCase()
      .replace(/,/g, ";")
      .replace(/\s+/g, "");
  }

  function highlightTeamButton(teamId) {
    document.querySelectorAll(".team-btn").forEach(btn => {
      if (btn.dataset.team === teamId) {
        btn.style.outline = "2px solid #22c55e";
      } else {
        btn.style.outline = "none";
      }
    });
  }
  if (chosenTeam) highlightTeamButton(chosenTeam);

  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      chosenTeam = btn.dataset.team;
      highlightTeamButton(chosenTeam);
    });
  });

  joinBtn.addEventListener("click", () => {
    if (!chosenTeam) {
      alert("Hãy chọn màu đội.");
      return;
    }
    const nick = nicknameInput.value.trim();
    const name = nick || (
      chosenTeam === "green" ? "Đội Xanh" :
      chosenTeam === "red" ? "Đội Đỏ" :
      chosenTeam === "orange" ? "Đội Cam" :
      "Đội Tím"
    );
    set(ref(db, "quiz/teams/" + chosenTeam + "/name"), name);
    teamNameLabel.textContent = `${name} (${chosenTeam})`;
    teamSelectCard.style.display = "none";
    gameCard.style.display = "block";
    subscribeTeamScore();
  });

  const infoRef = ref(db, ".info/connected");
  onValue(infoRef, (snap) => {
    if (snap.val() === true) {
      connectStatus.textContent = "Đã kết nối Firebase";
      connectStatus.style.borderColor = "rgba(74,222,128,0.9)";
    } else {
      connectStatus.textContent = "Mất kết nối…";
      connectStatus.style.borderColor = "rgba(239,68,68,0.9)";
    }
  });

  const stateRef = ref(db, "quiz/state");
  onValue(stateRef, (snap) => {
    const v = snap.val() || {};
    currentQuestionIndex = v.currentQuestionIndex ?? -1;
    questionStartTime = v.questionStartTime ?? null;
    renderQuestion(currentQuestionIndex);
  });

  function subscribeTeamScore() {
    if (!chosenTeam) return;
    const scoreRef = ref(db, "quiz/teams/" + chosenTeam + "/score");
    onValue(scoreRef, (snap) => {
      scoreLabel.textContent = snap.val() || 0;
    });
  }

  function renderQuestion(idx) {
    feedbackBox.textContent = "";
    selectedOptionIndex = null;
    submitBtn.disabled = true;

    if (idx < 0 || idx >= questions.length) {
      qIndexLabel.textContent = "- / " + questions.length;
      qText.textContent = "Đang chờ giáo viên bắt đầu câu hỏi.";
      mcqBox.style.display = "none";
      fillBox.style.display = "none";
      statusRow.textContent = "Chưa có câu hỏi.";
      return;
    }
    const q = questions[idx];
    currentQuestionType = q.type;
    qIndexLabel.textContent = (idx + 1) + " / " + questions.length;
    qText.textContent = q.text;
    statusRow.textContent = "Câu mới – làm nhanh và chính xác!";
    submitBtn.disabled = false;

    mcqBox.innerHTML = "";
    fillBox.style.display = "none";
    if (q.type === "mcq") {
      mcqBox.style.display = "grid";
      (q.options || []).forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.dataset.index = i;
        btn.innerHTML = `<div class="option-label">${String.fromCharCode(65 + i)}</div><div>${opt}</div>`;
        btn.addEventListener("click", () => {
          selectedOptionIndex = i;
          document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
        });
        mcqBox.appendChild(btn);
      });
    } else {
      mcqBox.style.display = "none";
      fillBox.style.display = "block";
      fillInput.value = "";
    }
  }

  function computeScore() {
    if (!questionStartTime) return { gained: 0, elapsed: "0.0" };
    const elapsed = (Date.now() - questionStartTime) / 1000;
    const s = Math.floor(elapsed);
    const gained = Math.max(0, 300 - 10 * s);
    return { gained, elapsed: elapsed.toFixed(1) };
  }

  submitBtn.addEventListener("click", async () => {
    if (!chosenTeam) {
      alert("Bạn chưa chọn đội.");
      return;
    }
    if (currentQuestionIndex < 0) {
      alert("Chưa có câu hỏi.");
      return;
    }

    const q = questions[currentQuestionIndex];
    const ansRef = ref(db, `quiz/teamAnswers/${chosenTeam}/${currentQuestionIndex}`);

    const existed = await get(ansRef);
    if (existed.exists()) {
      statusRow.textContent = "Bạn đã trả lời câu này rồi.";
      submitBtn.disabled = true;
      return;
    }

    let isCorrect = false;

    if (q.type === "mcq") {
      if (selectedOptionIndex === null) {
        alert("Hãy chọn một đáp án A/B/C/D trước.");
        return;
      }
      isCorrect = selectedOptionIndex === q.correctOptionIndex;
    } else {
      const ans = fillInput.value;
      if (!ans.trim()) {
        alert("Hãy nhập đáp án.");
        return;
      }
      const norm = normalizeAnswer(ans);
      for (const pattern of (q.answerPatterns || [])) {
        if (norm === normalizeAnswer(pattern)) {
          isCorrect = true;
          break;
        }
      }
    }

    const { gained, elapsed } = computeScore();

    if (!isCorrect) {
      feedbackBox.textContent = "Sai hoặc không khớp dạng đáp án. Câu này không được điểm.";
      statusRow.textContent = "Đã gửi, câu này không được điểm.";
      submitBtn.disabled = true;
      await set(ansRef, { correct: false, gained: 0, at: Date.now() });
      return;
    }

    const scoreRef = ref(db, "quiz/teams/" + chosenTeam + "/score");
    await runTransaction(scoreRef, (prev) => {
      const base = prev || 0;
      return base + gained;
    });

    await set(ansRef, { correct: true, gained, at: Date.now() });

    feedbackBox.textContent = `Đúng! Bạn được ${gained} điểm (thời gian: ${elapsed}s).`;
    statusRow.textContent = "Đã gửi đáp án. Chờ GV sang câu mới.";
    submitBtn.disabled = true;
  });

  // Nếu đã có ?team=... trên URL, tự subscribe sẵn điểm
  if (chosenTeam) subscribeTeamScore();
</script>
</body>
</html>
