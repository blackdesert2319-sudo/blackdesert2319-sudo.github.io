<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cờ ca rô – ĐỨC QUANG vs BÁ TRỰC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #020617 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      transition: background 0.4s ease;
      overflow: hidden;
    }

    body.winner-x {
      background: radial-gradient(circle at top, #0f172a 0, #022c22 50%, #020617 100%);
    }
    body.winner-o {
      background: radial-gradient(circle at top, #111827 0, #4a044e 50%, #020617 100%);
    }

    /* phóng to game ~120% trên màn hình rộng */
    .scale-wrap {
      transform: scale(1.2);
      transform-origin: center top;
    }
    @media (max-width: 900px) {
      .scale-wrap {
        transform: scale(1);
      }
    }

    .game-container {
      width: min(1100px, 96vw);
      padding: 22px 24px 32px;
      border-radius: 24px;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98));
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.9),
        0 0 70px rgba(15, 23, 42, 1);
      border: 1px solid rgba(148, 163, 184, 0.48);
      position: relative;
      overflow: hidden;
    }

    .game-container::before {
      content: "";
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.18) 0, transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(251, 113, 133, 0.18) 0, transparent 55%),
        radial-gradient(circle at 50% 40%, rgba(129, 140, 248, 0.18) 0, transparent 60%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: clamp(26px, 3.4vw, 32px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #facc15;
      text-shadow:
        0 0 18px rgba(250, 204, 21, 1),
        0 0 36px rgba(250, 204, 21, 1);
      position: relative;
      z-index: 1;
    }

    /* VS badge dưới title */
    .vs-bar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .vs-line {
      height: 1px;
      width: 90px;
      background: linear-gradient(to right, transparent, rgba(148, 163, 184, 0.7), transparent);
      box-shadow:
        0 0 10px rgba(148, 163, 184, 0.8),
        0 0 18px rgba(148, 163, 184, 0.7);
    }

    .vs-badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(248, 250, 252, 0.7);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98));
      font-weight: 800;
      letter-spacing: 0.2em;
      font-size: 14px;
      color: #e5e7eb;
      text-shadow:
        0 0 10px rgba(248, 250, 252, 1),
        0 0 18px rgba(129, 140, 248, 1);
      box-shadow:
        0 0 16px rgba(129, 140, 248, 0.9),
        0 0 30px rgba(37, 99, 235, 0.9);
    }

    /* Panel chọn bàn & nút reset – ẩn khỏi UI, vẫn để JS dùng */
    .control-row { display: none; }

    /* Ẩn text trạng thái & lượt chơi để đỡ rối */
    #voiceStatus, #message {
      display: none;
    }

    .arena {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      margin-top: 6px;
    }

    /* ===== PLAYER CARD – ESPORTS NEON ===== */
    .player {
      flex: 0 0 240px;
      padding: 18px 16px 20px;
      border-radius: 22px;
      background:
        radial-gradient(circle at top left, #020617, #020617 40%, #020617 100%);
      border: 1px solid rgba(96, 165, 250, 0.9);
      box-shadow:
        0 0 40px rgba(56, 189, 248, 0.75),
        0 0 80px rgba(37, 99, 235, 1);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      perspective: 800px;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.32), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(251, 113, 133, 0.32), transparent 55%);
      opacity: 0.35;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .player.active::before {
      opacity: 1;
    }

    .name-block {
      position: relative;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .player-name {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 24px;
      white-space: nowrap;
      text-shadow:
        0 0 4px rgba(15, 23, 42, 1),
        0 0 10px rgba(248, 250, 252, 1),
        0 0 20px rgba(248, 250, 252, 1),
        0 0 32px rgba(56, 189, 248, 1);
      transform: translateZ(20px);
    }

    #playerX .player-name {
      color: #38bdf8;
      text-align: left;
    }

    #playerO .player-name {
      color: #fb7185;
      text-align: right;
      text-shadow:
        0 0 4px rgba(15, 23, 42, 1),
        0 0 10px rgba(248, 250, 252, 1),
        0 0 20px rgba(248, 250, 252, 1),
        0 0 32px rgba(251, 113, 133, 1);
    }

    .name-underline {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, rgba(148, 163, 184, 0.1), #e5e7eb, rgba(148, 163, 184, 0.1));
      box-shadow:
        0 0 10px rgba(248, 250, 252, 1),
        0 0 18px rgba(148, 163, 184, 0.9);
    }

    .avatar-circle {
      flex: 0 0 50px;
      height: 50px;
      border-radius: 999px;
      border: 2px solid rgba(248, 250, 252, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.06em;
      text-shadow: 0 0 12px rgba(248, 250, 252, 1);
      box-shadow:
        0 0 16px rgba(248, 250, 252, 0.9),
        0 0 30px rgba(37, 99, 235, 0.9);
      background: radial-gradient(circle at top, #020617, #020617 60%, #0b1120 100%);
    }

    #playerX .avatar-circle {
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.9),
        0 0 34px rgba(37, 99, 235, 0.95);
    }

    #playerO .avatar-circle {
      border-color: #fb7185;
      color: #fb7185;
      box-shadow:
        0 0 18px rgba(251, 113, 133, 0.95),
        0 0 34px rgba(190, 24, 93, 0.95);
    }

    .player-bottom {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .wins {
      font-size: 14px;
      color: #e5e7eb;
      opacity: 0.9;
    }

    .wins span {
      color: #facc15;
      font-weight: 800;
      text-shadow:
        0 0 12px rgba(250, 204, 21, 1),
        0 0 22px rgba(250, 204, 21, 1);
    }

    .symbol-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      border: 1px solid rgba(148, 163, 184, 0.75);
      background: radial-gradient(circle at top, #020617, #020617);
      text-shadow: 0 0 8px rgba(148, 163, 184, 0.9);
      box-shadow:
        0 0 16px rgba(15, 23, 42, 0.95),
        0 0 30px rgba(15, 23, 42, 0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .symbol-pill.big {
      width: 48px;
      height: 48px;
      border-width: 2px;
      font-size: 22px;
    }

    #playerX .symbol-pill {
      border-color: #38bdf8;
      color: #38bdf8;
      text-shadow:
        0 0 14px rgba(56, 189, 248, 1),
        0 0 26px rgba(56, 189, 248, 0.9);
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.9),
        0 0 34px rgba(37, 99, 235, 0.95);
    }

    #playerO .symbol-pill {
      border-color: #fb7185;
      color: #fb7185;
      text-shadow:
        0 0 14px rgba(251, 113, 133, 1),
        0 0 26px rgba(251, 113, 133, 0.9);
      box-shadow:
        0 0 18px rgba(251, 113, 133, 0.95),
        0 0 34px rgba(190, 24, 93, 0.95);
    }

    .player.active {
      box-shadow:
        0 0 46px rgba(56, 189, 248, 1),
        0 0 80px rgba(129, 140, 248, 1);
      border-color: rgba(129, 140, 248, 1);
      animation: playerTilt 1.4s ease-in-out infinite alternate;
    }

    @keyframes playerTilt {
      0% { transform: rotateY(-4deg) translateY(0); }
      100% { transform: rotateY(3deg) translateY(-3px); }
    }

    .player.active .player-name {
      animation: nameBlink 1s linear infinite;
    }

    @keyframes nameBlink {
      0%, 100% {
        opacity: 1;
        text-shadow:
          0 0 6px rgba(15, 23, 42, 1),
          0 0 14px rgba(248, 250, 252, 1),
          0 0 26px rgba(129, 140, 248, 1),
          0 0 44px rgba(56, 189, 248, 1);
      }
      50% {
        opacity: 0.75;
        text-shadow:
          0 0 4px rgba(15, 23, 42, 1),
          0 0 20px rgba(248, 250, 252, 1),
          0 0 36px rgba(129, 140, 248, 1),
          0 0 60px rgba(56, 189, 248, 1);
      }
    }

    .player.win-celebrate {
      box-shadow:
        0 0 40px rgba(250, 204, 21, 1),
        0 0 80px rgba(250, 204, 21, 1);
      border-color: #facc15;
      animation: winnerPulse 1s ease-in-out infinite;
    }

    @keyframes winnerPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    /* ===== BÀN CỜ ===== */
    .board-wrap {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
    }

    .board-container {
      position: relative;
      display: inline-block;
      padding-top: 32px;
      padding-left: 38px;
    }

    .board {
      --size: 3;
      display: grid;
      grid-template-columns: repeat(var(--size), 1fr);
      grid-auto-rows: 1fr;
      gap: 6px;
      width: min(460px, 90vw);
      aspect-ratio: 1 / 1;
      padding: 16px;
      border-radius: 26px;
      background: radial-gradient(circle at top, #020617 0%, #020617 45%, #020617 100%);
      border: 2px solid rgba(55, 65, 81, 0.98);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.45),
        0 0 40px rgba(37, 99, 235, 0.6),
        0 0 100px rgba(15, 23, 42, 1);
      animation: boardGlow 3s ease-in-out infinite alternate;
    }

    @keyframes boardGlow {
      0% {
        box-shadow:
          0 0 18px rgba(56, 189, 248, 0.35),
          0 0 32px rgba(37, 99, 235, 0.45),
          0 0 70px rgba(15, 23, 42, 1);
      }
      100% {
        box-shadow:
          0 0 38px rgba(56, 189, 248, 0.8),
          0 0 70px rgba(37, 99, 235, 0.9),
          0 0 120px rgba(15, 23, 42, 1);
      }
    }

    .row-labels {
      position: absolute;
      left: 0;
      top: 32px;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 0;
      font-size: 18px;
      color: #e5e7eb;
    }
    .row-labels div {
      width: 28px;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-shadow:
        0 0 12px rgba(59, 130, 246, 1),
        0 0 26px rgba(37, 99, 235, 1);
    }

    .col-labels {
      position: absolute;
      left: 38px;
      right: 0;
      top: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 38px;
      font-size: 18px;
      color: #e5e7eb;
    }
    .col-labels div {
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-shadow:
        0 0 12px rgba(59, 130, 246, 1),
        0 0 26px rgba(37, 99, 235, 1);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 900;
      color: #e5e7eb;
      /* giữ ô luôn vuông, không co giãn khi có X/O */
      aspect-ratio: 1 / 1;
      background:
        radial-gradient(circle at 20% 0%, rgba(148, 163, 184, 0.18), transparent 55%),
        linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 1));
      border-radius: 18px;
      cursor: pointer;
      user-select: none;
      box-shadow:
        inset 0 0 0 1px rgba(55, 65, 81, 0.9),
        0 8px 18px rgba(0, 0, 0, 1),
        0 0 18px rgba(15, 23, 42, 1);
      transition:
        transform 0.1s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        filter 0.12s ease;
      position: relative;
      overflow: hidden;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 10% -10%, rgba(255, 255, 255, 0.09), transparent 60%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .cell:hover {
      background:
        radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.25), transparent 55%),
        linear-gradient(135deg, rgba(15, 23, 42, 1), rgba(17, 24, 39, 1));
      transform: translateY(-1px);
      box-shadow:
        inset 0 0 0 1px rgba(148, 163, 184, 0.98),
        0 12px 22px rgba(15, 23, 42, 1),
        0 0 22px rgba(56, 189, 248, 0.55);
    }

    .cell:hover::before { opacity: 1; }

    .cell:active {
      transform: translateY(0);
      box-shadow:
        inset 0 0 0 1px rgba(75, 85, 99, 1),
        0 8px 16px rgba(0, 0, 0, 1),
        0 0 16px rgba(15, 23, 42, 1);
      filter: brightness(0.96);
    }

    .cell.X {
      color: #38bdf8;
      text-shadow:
        0 0 18px rgba(56, 189, 248, 1),
        0 0 32px rgba(56, 189, 248, 0.9);
    }

    .cell.O {
      color: #fb7185;
      text-shadow:
        0 0 18px rgba(251, 113, 133, 1),
        0 0 32px rgba(251, 113, 133, 0.9);
    }

    /* nền sáng riêng khi X/O đã đánh vào – kiểu thắng màu xanh lá / vàng */
    .cell.filled-x {
      background:
        radial-gradient(circle at top, rgba(22, 163, 74, 0.4), transparent 70%),
        linear-gradient(145deg, #022c22, #064e3b);
      box-shadow:
        inset 0 0 0 1px rgba(187, 247, 208, 0.9),
        0 8px 16px rgba(0, 0, 0, 1),
        0 0 18px rgba(34, 197, 94, 0.9);
    }

    .cell.filled-o {
      background:
        radial-gradient(circle at top, rgba(250, 204, 21, 0.5), transparent 70%),
        linear-gradient(145deg, #7c2d12, #c2410c);
      box-shadow:
        inset 0 0 0 1px rgba(254, 249, 195, 0.95),
        0 8px 16px rgba(0, 0, 0, 1),
        0 0 18px rgba(251, 191, 36, 0.95);
    }

    .cell.disabled {
      pointer-events: none;
      filter: grayscale(0.4) brightness(0.88);
    }

    .cell.win-cell {
      position: relative;
      background:
        radial-gradient(circle at center, rgba(248, 250, 252, 0.4), transparent 65%),
        linear-gradient(145deg, #f97316, #b91c1c);
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }

    .cell.win-cell::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 2px solid rgba(248, 250, 252, 0.9);
      box-shadow:
        0 0 12px rgba(248, 250, 252, 1),
        0 0 24px rgba(251, 146, 60, 1);
      opacity: 0.95;
      pointer-events: none;
    }

    @keyframes winPulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.18); }
    }

    .cell.blink-multi {
      animation: blinkMulti 0.55s alternate ease-in-out infinite;
    }

    @keyframes blinkMulti {
      0% {
        filter: brightness(0.8);
        box-shadow:
          inset 0 0 0 1px rgba(31, 41, 55, 0.9),
          0 6px 12px rgba(0, 0, 0, 1),
          0 0 10px rgba(15, 23, 42, 1);
      }
      100% {
        filter: brightness(1.4);
        box-shadow:
          0 0 18px var(--blink-color, rgba(250, 204, 21, 0.9)),
          0 0 34px var(--blink-color, rgba(250, 204, 21, 0.9)),
          0 0 60px rgba(15, 23, 42, 1);
      }
    }

    .board.shake { }

    /* ===== BANNER CHIẾN THẮNG – ESPORTS ===== */
    .win-banner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }

    .win-banner.visible {
      opacity: 1;
      transform: scale(1);
    }

    .win-banner-inner {
      padding: 18px 32px;
      border-radius: 999px;
      border: 2px solid rgba(248, 250, 252, 0.95);
      background:
        radial-gradient(circle at top, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.98));
      box-shadow:
        0 0 24px rgba(248, 250, 252, 1),
        0 0 60px rgba(250, 204, 21, 1);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .win-banner-text {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #fef9c3;
      text-shadow:
        0 0 18px rgba(250, 204, 21, 1),
        0 0 34px rgba(250, 204, 21, 1);
      white-space: nowrap;
    }

    .win-banner-chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #111827;
      background: linear-gradient(to right, #facc15, #f97316);
      box-shadow:
        0 0 14px rgba(250, 204, 21, 1),
        0 0 26px rgba(249, 115, 22, 1);
    }

    @media (max-width: 860px) {
      .arena {
        flex-direction: column;
        gap: 16px;
      }
      .player {
        width: 100%;
        max-width: 420px;
      }
      #playerO .player-name { text-align: left; }
      .win-banner-inner {
        padding: 12px 18px;
      }
      .win-banner-text {
        font-size: 16px;
        letter-spacing: 0.14em;
      }
      .win-banner-chip {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .player { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="scale-wrap">
    <div class="game-container">
      <h1>CỜ CA RÔ – ĐỨC QUANG vs BÁ TRỰC</h1>

      <div class="vs-bar">
        <div class="vs-line"></div>
        <div class="vs-badge">VS</div>
        <div class="vs-line"></div>
      </div>

      <!-- Panel ẩn -->
      <div class="control-row">
        <div class="control-panel">
          <label for="boardSize">
            Kích thước bàn cờ:
            <select id="boardSize">
              <option value="3">3 × 3</option>
              <option value="4">4 × 4</option>
              <option value="5" selected>5 × 5</option>
              <option value="6">6 × 6</option>
              <option value="7">7 × 7</option>
            </select>
          </label>
          <button id="resetMatch">Chơi lại ván mới</button>
        </div>
      </div>

      <div id="voiceStatus"></div>

      <!-- Banner chiến thắng -->
      <div id="winBanner" class="win-banner">
        <div class="win-banner-inner">
          <div class="win-banner-text" id="winBannerText"></div>
          <div class="win-banner-chip">CHIẾN THẮNG</div>
        </div>
      </div>

      <div class="arena">
        <div class="player" id="playerX">
          <div class="name-block">
            <div class="player-name">ĐỨC QUANG</div>
            <div class="avatar-circle">DQ</div>
            <div class="name-underline"></div>
          </div>
          <div class="player-bottom">
            <div class="wins">Ván thắng: <span id="scoreX">0</span></div>
            <div class="symbol-pill big">X</div>
          </div>
        </div>

        <div class="board-wrap">
          <div class="board-container">
            <div class="col-labels" id="colLabels"></div>
            <div class="row-labels" id="rowLabels"></div>
            <div id="board" class="board"></div>
          </div>
        </div>

        <div class="player" id="playerO">
          <div class="name-block">
            <div class="avatar-circle">BT</div>
            <div class="player-name">BÁ TRỰC</div>
            <div class="name-underline"></div>
          </div>
          <div class="player-bottom">
            <div class="wins">Ván thắng: <span id="scoreO">0</span></div>
            <div class="symbol-pill big">O</div>
          </div>
        </div>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <script>
    const PLAYER_X = { name: "ĐỨC QUANG", symbol: "X" };
    const PLAYER_O = { name: "BÁ TRỰC", symbol: "O" };

    let boardSize = 5;
    let boardState = [];
    let currentPlayer = PLAYER_X.symbol;
    let startingPlayer = PLAYER_X.symbol;
    let scores = { X: 0, O: 0 };
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const sizeSelect = document.getElementById("boardSize");
    const resetBtn = document.getElementById("resetMatch");
    const playerXEl = document.getElementById("playerX");
    const playerOEl = document.getElementById("playerO");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const rowLabelsEl = document.getElementById("rowLabels");
    const colLabelsEl = document.getElementById("colLabels");
    const winBanner = document.getElementById("winBanner");
    const winBannerText = document.getElementById("winBannerText");

    /* ====== ÂM THANH CLICK ĐƠN GIẢN BẰNG WEB AUDIO API ====== */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
        }
      }
    }

    function playClickSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 700;
      gain.gain.value = 0.08;
      osc.connect(gain).connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.start(now);
      osc.stop(now + 0.09);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    }

    function updateLabels() {
      const letters = ["A", "B", "C", "D", "E", "F", "G"];
      rowLabelsEl.innerHTML = "";
      colLabelsEl.innerHTML = "";

      for (let i = 0; i < boardSize; i++) {
        const r = document.createElement("div");
        r.textContent = letters[i];
        rowLabelsEl.appendChild(r);

        const c = document.createElement("div");
        c.textContent = String(i + 1);
        colLabelsEl.appendChild(c);
      }
    }

    function createBoard() {
      boardEl.innerHTML = "";
      boardEl.style.setProperty("--size", boardSize);
      boardState = new Array(boardSize * boardSize).fill("");

      for (let i = 0; i < boardState.length; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.index = String(i);
        cell.addEventListener("click", onCellClick);
        boardEl.appendChild(cell);
      }

      updateLabels();

      gameOver = false;
      playerXEl.classList.remove("win-celebrate");
      playerOEl.classList.remove("win-celebrate");
      document.body.classList.remove("winner-x", "winner-o");
      hideWinBanner();

      updateActivePlayerUI();
    }

    function indexToRC(index) {
      const row = Math.floor(index / boardSize);
      const col = index % boardSize;
      return { row: row, col: col };
    }

    function rcToIndex(row, col) {
      return row * boardSize + col;
    }

    function onCellClick(e) {
      if (gameOver) return;

      const cell = e.currentTarget;
      const index = parseInt(cell.dataset.index, 10);
      if (boardState[index] !== "") return;

      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer);
      if (currentPlayer === PLAYER_X.symbol) {
        cell.classList.add("filled-x");
      } else {
        cell.classList.add("filled-o");
      }
      playClickSound();

      const winInfo = checkWin();
      if (winInfo) {
        handleWin(winInfo);
        return;
      }

      if (boardState.every(function (v) { return v !== ""; })) {
        handleDraw();
        return;
      }

      currentPlayer = currentPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
      updateActivePlayerUI();
    }

    function currentWinLength() {
      if (boardSize <= 4) return 3;
      if (boardSize === 5) return 4;
      return 5; // 6x6, 7x7
    }

    function checkWin() {
      const size = boardSize;
      const needed = currentWinLength();
      const dirs = [
        { dr: 0, dc: 1 },
        { dr: 1, dc: 0 },
        { dr: 1, dc: 1 },
        { dr: 1, dc: -1 }
      ];

      for (let index = 0; index < boardState.length; index++) {
        const symbol = boardState[index];
        if (!symbol) continue;

        const rc = indexToRC(index);
        const row = rc.row;
        const col = rc.col;

        for (let d = 0; d < dirs.length; d++) {
          const dr = dirs[d].dr;
          const dc = dirs[d].dc;
          const line = [index];
          let ok = true;

          for (let k = 1; k < needed; k++) {
            const r = row + dr * k;
            const c = col + dc * k;
            if (r < 0 || r >= size || c < 0 || c >= size) {
              ok = false;
              break;
            }
            const idx = rcToIndex(r, c);
            if (boardState[idx] !== symbol) {
              ok = false;
              break;
            }
            line.push(idx);
          }

          if (ok && line.length === needed) {
            return { winner: symbol, line: line };
          }
        }
      }
      return null;
    }

    function disableBoard() {
      const cells = boardEl.querySelectorAll(".cell");
      cells.forEach(function (c) { c.classList.add("disabled"); });
    }

    function highlightWinningCells(line) {
      const cells = boardEl.querySelectorAll(".cell");
      line.forEach(function (idx) {
        if (cells[idx]) cells[idx].classList.add("win-cell");
      });
    }

    function showWinBanner(symbol) {
      const name = symbol === PLAYER_X.symbol ? PLAYER_X.name : PLAYER_O.name;
      if (winBannerText) {
        winBannerText.textContent = (name + " chiến thắng!").toUpperCase();
      }
      if (winBanner) {
        winBanner.classList.add("visible");
      }
    }

    function hideWinBanner() {
      if (winBanner) {
        winBanner.classList.remove("visible");
      }
    }

    function handleWin(winInfo) {
      gameOver = true;
      disableBoard();
      highlightWinningCells(winInfo.line);

      const winnerSymbol = winInfo.winner;
      scores[winnerSymbol]++;
      scoreXEl.textContent = String(scores.X);
      scoreOEl.textContent = String(scores.O);

      if (winnerSymbol === PLAYER_X.symbol) {
        document.body.classList.add("winner-x");
        playerXEl.classList.add("win-celebrate");
        playerOEl.classList.remove("active");
      } else {
        document.body.classList.add("winner-o");
        playerOEl.classList.add("win-celebrate");
        playerXEl.classList.remove("active");
      }

      // Banner esports
      showWinBanner(winnerSymbol);

      // Hiệu ứng nhấp nháy dịu hơn toàn bàn
      const cells = boardEl.querySelectorAll(".cell");
      const colors = [
        "rgba(56, 189, 248, 0.95)",
        "rgba(34, 197, 94, 0.95)",
        "rgba(250, 204, 21, 0.95)",
        "rgba(251, 113, 133, 0.95)",
        "rgba(129, 140, 248, 0.95)"
      ];
      cells.forEach(function (cell) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const duration = 0.45 + Math.random() * 0.5;
        const delay = Math.random() * 0.4;
        cell.classList.add("blink-multi");
        cell.style.setProperty("--blink-color", color);
        cell.style.animationDuration = String(duration) + "s";
        cell.style.animationDelay = String(delay) + "s";
      });

      setTimeout(function () {
        cells.forEach(function (cell) {
          cell.classList.remove("blink-multi");
          cell.style.removeProperty("--blink-color");
          cell.style.animationDuration = "";
          cell.style.animationDelay = "";
        });

        playerXEl.classList.remove("win-celebrate");
        playerOEl.classList.remove("win-celebrate");
        document.body.classList.remove("winner-x", "winner-o");
        hideWinBanner();

        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 4000);
    }

    function handleDraw() {
      gameOver = true;

      const cells = boardEl.querySelectorAll(".cell");
      cells.forEach(function (c) { c.classList.add("disabled"); });

      setTimeout(function () {
        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 650);
    }

    function updateActivePlayerUI() {
      playerXEl.classList.remove("active");
      playerOEl.classList.remove("active");
      if (currentPlayer === PLAYER_X.symbol) {
        playerXEl.classList.add("active");
      } else {
        playerOEl.classList.add("active");
      }
    }

    function setBoardSize(size) {
      boardSize = size;
      if (sizeSelect) sizeSelect.value = String(size);
      startingPlayer = PLAYER_X.symbol;
      currentPlayer = startingPlayer;
      createBoard();
    }

    if (sizeSelect) {
      sizeSelect.addEventListener("change", function () {
        const size = parseInt(sizeSelect.value, 10);
        setBoardSize(size);
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", function () {
        startingPlayer = PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      });
    }

    // =============== NHẬN DIỆN GIỌNG NÓI (luôn bật) ===============
    let recognition = null;
    let listeningActive = true;

    function setupSpeechRecognition() {
      if (!("SpeechRecognition" in window || "webkitSpeechRecognition" in window)) {
        return;
      }

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = "vi-VN";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onend = function () {
        if (!listeningActive) return;
        if (!gameOver) {
          setTimeout(function () {
            try {
              recognition.start();
            } catch (e) {}
          }, 200);
        }
      };

      recognition.onresult = function (event) {
        const transcript = event.results[0][0].transcript;
        handleVoiceCommand(transcript);
      };
    }

    function vietnameseWordToNumber(word) {
      const map = {
        "một": 1, "mot": 1, "1": 1,
        "hai": 2, "2": 2,
        "ba": 3, "3": 3,
        "bốn": 4, "bon": 4, "4": 4,
        "năm": 5, "nam": 5, "5": 5,
        "sáu": 6, "sau": 6, "6": 6,
        "bảy": 7, "bay": 7, "bẩy": 7, "7": 7
      };
      if (map.hasOwnProperty(word)) return map[word];
      return null;
    }

    function letterToRow(letter) {
      let base = letter.toLowerCase();
      if (base.normalize) {
        base = base.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }

      const map = {
        "a": 1,
        "b": 2, "be": 2, "bo": 2,
        "c": 3, "ce": 3, "co": 3,
        "d": 4, "de": 4, "do": 4,
        "e": 5,
        "f": 6, "ep": 6,
        "g": 7, "ge": 7
      };

      if (map.hasOwnProperty(base)) return map[base];
      return null;
    }

    function setBoardSizeFromVoice(size) {
      setBoardSize(size);
    }

    function handleVoiceCommand(rawText) {
      const text = rawText.toLowerCase().trim();

      if (text.indexOf("chơi lại") !== -1 || text.indexOf("reset") !== -1 || text.indexOf("chơi ván mới") !== -1) {
        if (resetBtn) resetBtn.click();
        else {
          startingPlayer = PLAYER_X.symbol;
          currentPlayer = startingPlayer;
          createBoard();
        }
        return;
      }

      if (text.match(/7x7|7 x 7|bàn 7|bàn cờ 7/)) { setBoardSizeFromVoice(7); return; }
      if (text.match(/6x6|6 x 6|bàn 6|bàn cờ 6/)) { setBoardSizeFromVoice(6); return; }
      if (text.match(/5x5|5 x 5|bàn 5|bàn cờ 5/)) { setBoardSizeFromVoice(5); return; }
      if (text.match(/4x4|4 x 4|bàn 4|bàn cờ 4/)) { setBoardSizeFromVoice(4); return; }
      if (text.match(/3x3|3 x 3|bàn 3|bàn cờ 3/)) { setBoardSizeFromVoice(3); return; }

      if (gameOver) {
        return;
      }

      let row = null;
      let col = null;

      const tokens = text
        .replace(/[,\.]/g, " ")
        .split(/\s+/)
        .filter(function (t) { return t.length > 0; });

      const numbers = [];
      const letters = [];

      tokens.forEach(function (tok) {
        let m = tok.match(/^([a-gA-G])(\d)$/);
        if (m) {
          letters.push(m[1]);
          numbers.push(parseInt(m[2], 10));
          return;
        }

        const rowFromLetter = letterToRow(tok);
        if (rowFromLetter !== null) {
          letters.push(tok);
          return;
        }

        if (/^\d+$/.test(tok) && tok.length >= 2) {
          tok.split("").forEach(function (ch) {
            const n = parseInt(ch, 10);
            if (!isNaN(n)) numbers.push(n);
          });
          return;
        }

        const vn = vietnameseWordToNumber(tok);
        if (vn !== null) {
          numbers.push(vn);
        } else if (/^\d$/.test(tok)) {
          numbers.push(parseInt(tok, 10));
        }
      });

      if (letters.length >= 1 && numbers.length >= 1) {
        row = letterToRow(letters[0]);
        col = numbers[0];
      } else if (numbers.length >= 2) {
        row = numbers[0];
        col = numbers[1];
      }

      if (row === null || col === null) {
        return;
      }

      if (row < 1 || row > boardSize || col < 1 || col > boardSize) {
        return;
      }

      const rIndex = row - 1;
      const cIndex = col - 1;
      const cellIndex = rcToIndex(rIndex, cIndex);
      const cellEl = boardEl.querySelector('.cell[data-index="' + cellIndex + '"]');

      if (!cellEl) {
        return;
      }

      if (boardState[cellIndex] !== "") {
        return;
      }

      cellEl.click();
    }

    (function init() {
      createBoard();
      setupSpeechRecognition();
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
