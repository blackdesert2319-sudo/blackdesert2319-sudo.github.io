<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cờ ca rô – ĐỨC QUANG vs BÁ TRỰC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2933 0, #020617 55%, #000 100%);
      color: #e5e7eb;
    }

    .game-container {
      width: min(900px, 95vw);
      padding: 20px 24px 28px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 14px;
      font-size: clamp(22px, 3vw, 26px);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #facc15;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.7);
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .control-panel label {
      font-size: 14px;
      color: #d1d5db;
    }

    select {
      margin-left: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }

    button {
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ecfeff;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
      transition: transform 0.08s ease, box-shadow 0.1s ease, filter 0.1s ease;
      white-space: nowrap;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.7);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .players {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .player {
      flex: 1 1 150px;
      min-width: 160px;
      padding: 8px 10px;
      border-radius: 14px;
      background: radial-gradient(circle at top left, #0b1120, #020617);
      border: 1px solid rgba(55, 65, 81, 0.9);
      position: relative;
      overflow: hidden;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .player.active::before {
      opacity: 1;
    }

    .player .name {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 13px;
      margin-bottom: 4px;
    }

    #playerX .name {
      color: #38bdf8;
    }

    #playerO .name {
      color: #fb7185;
    }

    .player .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #d1d5db;
    }

    .symbol-pill {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.85);
      text-shadow: 0 0 6px rgba(148, 163, 184, 0.8);
    }

    #playerX .symbol-pill {
      border-color: #38bdf8;
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.9);
    }

    #playerO .symbol-pill {
      border-color: #fb7185;
      text-shadow: 0 0 6px rgba(251, 113, 133, 0.9);
    }

    .wins {
      margin-top: 3px;
      font-size: 12px;
      color: #9ca3af;
    }

    .wins span {
      color: #facc15;
      font-weight: 600;
    }

    .player.active {
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.55);
      border-color: rgba(96, 165, 250, 0.9);
      animation: glowPulse 1.1s ease-in-out infinite;
    }

    .player.active .name {
      animation: nameBlink 0.8s linear infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
      50% { box-shadow: 0 0 24px rgba(96, 165, 250, 0.9); }
    }

    @keyframes nameBlink {
      0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(250, 250, 250, 0.8); }
      50% { opacity: 0.4; text-shadow: 0 0 18px rgba(250, 250, 250, 1); }
    }

    #message {
      margin: 14px 0 10px;
      min-height: 20px;
      font-size: 14px;
      text-align: center;
      color: #e5e7eb;
    }

    .board-wrap {
      display: flex;
      justify-content: center;
    }

    .board {
      --size: 5;
      display: grid;
      grid-template-columns: repeat(var(--size), minmax(60px, 1fr));
      gap: 4px;
      width: min(430px, 90vw);
      aspect-ratio: 1 / 1;
      padding: 10px;
      border-radius: 16px;
      background: radial-gradient(circle at top, #020617, #020617);
      border: 1px solid rgba(75, 85, 99, 0.9);
      position: relative;
      overflow: hidden;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      color: #e5e7eb;
      background: radial-gradient(circle at top left, #020617, #111827);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      box-shadow:
        inset 0 0 0 1px rgba(55, 65, 81, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.7);
      transition: transform 0.08s ease, box-shadow 0.1s ease, background 0.1s ease, filter 0.12s ease;
    }

    .cell:hover {
      background: radial-gradient(circle at top, #111827, #020617);
      transform: translateY(-1px);
      box-shadow:
        inset 0 0 0 1px rgba(148, 163, 184, 0.9),
        0 8px 18px rgba(15, 23, 42, 0.9);
    }

    .cell:active {
      transform: translateY(1px) scale(0.97);
      box-shadow:
        inset 0 0 0 1px rgba(75, 85, 99, 1),
        0 2px 6px rgba(0, 0, 0, 0.8);
      filter: brightness(0.9);
    }

    .cell.X {
      color: #38bdf8;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.95);
    }

    .cell.O {
      color: #fb7185;
      text-shadow: 0 0 18px rgba(251, 113, 133, 0.95);
    }

    .cell.disabled {
      pointer-events: none;
      filter: grayscale(0.5) brightness(0.85);
    }

    .cell.win-cell {
      position: relative;
      background: radial-gradient(circle at center, #f97316, #b91c1c);
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }

    .cell.win-cell::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 2px solid rgba(248, 250, 252, 0.7);
      box-shadow:
        0 0 12px rgba(248, 250, 252, 0.9),
        0 0 18px rgba(251, 146, 60, 0.9);
      opacity: 0.9;
      pointer-events: none;
    }

    @keyframes winPulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.07); filter: brightness(1.2); }
    }

    .board.explode {
      animation: explodeBoard 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes explodeBoard {
      0% {
        transform: scale(1);
        opacity: 1;
        filter: brightness(1);
      }
      40% {
        transform: scale(1.18) rotate(2deg);
        filter: brightness(1.35);
        box-shadow: 0 0 40px rgba(248, 250, 252, 0.9);
      }
      100% {
        transform: scale(0.1) rotate(8deg);
        opacity: 0;
        filter: brightness(1.6);
      }
    }

    .board.shake {
      animation: shakeDraw 0.4s ease-in-out;
    }

    @keyframes shakeDraw {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @media (max-width: 640px) {
      .top-row {
        flex-direction: column;
        align-items: stretch;
      }
      .players {
        justify-content: space-between;
      }
      .player {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>CỜ CA RÔ – ĐỨC QUANG vs BÁ TRỰC</h1>
    <div class="subtitle">Chọn kích thước bàn cờ, 2 người thay phiên đánh – ai chiếm đủ 3 ô thẳng hàng sẽ thắng.</div>

    <div class="top-row">
      <div class="control-panel">
        <label for="boardSize">
          Kích thước bàn cờ:
          <select id="boardSize">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5" selected>5 × 5</option>
          </select>
        </label>
        <button id="resetMatch">Chơi lại ván mới</button>
      </div>

      <div class="players">
        <div class="player" id="playerX">
          <div class="name">ĐỨC QUANG</div>
          <div class="row">
            <span>Quân:</span>
            <span class="symbol-pill">X</span>
          </div>
          <div class="wins">Ván thắng: <span id="scoreX">0</span></div>
        </div>
        <div class="player" id="playerO">
          <div class="name">BÁ TRỰC</div>
          <div class="row">
            <span>Quân:</span>
            <span class="symbol-pill">O</span>
          </div>
          <div class="wins">Ván thắng: <span id="scoreO">0</span></div>
        </div>
      </div>
    </div>

    <div id="message"></div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
  </div>

  <script>
    const PLAYER_X = { name: "ĐỨC QUANG", symbol: "X" };
    const PLAYER_O = { name: "BÁ TRỰC", symbol: "O" };
    const WIN_LENGTH = 3;

    let boardSize = 5;
    let boardState = [];
    let currentPlayer = PLAYER_X.symbol;
    let startingPlayer = PLAYER_X.symbol;
    let scores = { X: 0, O: 0 };
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const sizeSelect = document.getElementById("boardSize");
    const resetBtn = document.getElementById("resetMatch");
    const msgEl = document.getElementById("message");
    const playerXEl = document.getElementById("playerX");
    const playerOEl = document.getElementById("playerO");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");

    // Web Audio – tạo âm thanh đơn giản không cần file
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq = 440, duration = 120, type = "square", volume = 0.12) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain).connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.start(now);
      osc.stop(now + duration / 1000);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);
    }

    function playClickSound() {
      playTone(620, 90, "square", 0.14);
    }

    function playWinExplosionSound() {
      if (!audioCtx) return;
      // một chuỗi "爆炸" nhỏ: 4–5 tone ngắn
      const baseTime = audioCtx.currentTime;
      const freqs = [200, 260, 330, 180, 120];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = f;
        gain.gain.value = 0.2;
        osc.connect(gain).connect(audioCtx.destination);
        const start = baseTime + i * 0.05;
        const end = start + 0.15;
        osc.start(start);
        gain.gain.exponentialRampToValueAtTime(0.0001, end);
        osc.stop(end);
      });
    }

    function playDrawSound() {
      playTone(320, 130, "triangle", 0.13);
      setTimeout(() => playTone(260, 110, "triangle", 0.11), 120);
    }

    function createBoard() {
      boardEl.innerHTML = "";
      boardEl.style.setProperty("--size", boardSize);
      boardState = new Array(boardSize * boardSize).fill("");

      for (let i = 0; i < boardState.length; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.index = i;
        cell.addEventListener("click", onCellClick);
        boardEl.appendChild(cell);
      }

      gameOver = false;
      boardEl.classList.remove("explode", "shake");
      updateActivePlayerUI();
      updateMessage();
    }

    function indexToRC(index) {
      const row = Math.floor(index / boardSize);
      const col = index % boardSize;
      return { row, col };
    }

    function rcToIndex(row, col) {
      return row * boardSize + col;
    }

    function onCellClick(e) {
      if (gameOver) return;
      initAudio(); // đảm bảo AudioContext khởi tạo sau tương tác đầu tiên

      const cell = e.currentTarget;
      const index = parseInt(cell.dataset.index, 10);

      if (boardState[index] !== "") return;

      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer);
      playClickSound();

      const winInfo = checkWin();
      if (winInfo) {
        handleWin(winInfo);
        return;
      }

      if (boardState.every(v => v !== "")) {
        handleDraw();
        return;
      }

      // đổi lượt
      currentPlayer = currentPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
      updateActivePlayerUI();
      updateMessage();
    }

    function checkWin() {
      // trả về { winner: "X"/"O", line: [index1,index2,index3] } hoặc null
      const size = boardSize;

      const directions = [
        { dr: 0, dc: 1 },   // ngang
        { dr: 1, dc: 0 },   // dọc
        { dr: 1, dc: 1 },   // chéo xuống phải
        { dr: 1, dc: -1 }   // chéo xuống trái
      ];

      for (let index = 0; index < boardState.length; index++) {
        const symbol = boardState[index];
        if (!symbol) continue;

        const { row, col } = indexToRC(index);

        for (const { dr, dc } of directions) {
          const line = [index];
          let ok = true;

          for (let k = 1; k < WIN_LENGTH; k++) {
            const r = row + dr * k;
            const c = col + dc * k;
            if (r < 0 || r >= size || c < 0 || c >= size) {
              ok = false;
              break;
            }
            const idx = rcToIndex(r, c);
            if (boardState[idx] !== symbol) {
              ok = false;
              break;
            }
            line.push(idx);
          }

          if (ok && line.length === WIN_LENGTH) {
            return { winner: symbol, line };
          }
        }
      }
      return null;
    }

    function disableBoard() {
      const cells = boardEl.querySelectorAll(".cell");
      cells.forEach(cell => cell.classList.add("disabled"));
    }

    function highlightWinningCells(line) {
      const cells = boardEl.querySelectorAll(".cell");
      line.forEach(idx => {
        const cell = cells[idx];
        if (cell) cell.classList.add("win-cell");
      });
    }

    function handleWin(winInfo) {
      gameOver = true;
      disableBoard();
      highlightWinningCells(winInfo.line);

      const winnerSymbol = winInfo.winner;
      scores[winnerSymbol]++;
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;

      const winnerName = winnerSymbol === PLAYER_X.symbol ? PLAYER_X.name : PLAYER_O.name;
      msgEl.textContent = `${winnerName} thắng ván này với chuỗi 3 ô liên tiếp! 🎉`;

      playWinExplosionSound();
      setTimeout(() => {
        boardEl.classList.add("explode");
      }, 200);

      // Sau khi nổ xong thì tạo lại bàn cờ mới – luân phiên người đi trước
      setTimeout(() => {
        boardEl.classList.remove("explode");
        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 900);
    }

    function handleDraw() {
      gameOver = true;
      msgEl.textContent = "Hòa! Bàn cờ đã kín mà không ai đạt đủ 3 ô thẳng hàng. 🤝";
      playDrawSound();

      boardEl.classList.add("shake");
      disableBoard();

      setTimeout(() => {
        boardEl.classList.remove("shake");
        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 650);
    }

    function updateActivePlayerUI() {
      playerXEl.classList.remove("active");
      playerOEl.classList.remove("active");

      if (currentPlayer === PLAYER_X.symbol) {
        playerXEl.classList.add("active");
      } else {
        playerOEl.classList.add("active");
      }
    }

    function updateMessage() {
      const playerName = currentPlayer === PLAYER_X.symbol ? PLAYER_X.name : PLAYER_O.name;
      const symbol = currentPlayer;
      msgEl.textContent = `Đến lượt: ${playerName} (${symbol}) – hãy chọn 1 ô trống.`;
    }

    // Event listeners
    sizeSelect.addEventListener("change", () => {
      boardSize = parseInt(sizeSelect.value, 10);
      startingPlayer = PLAYER_X.symbol; // khi đổi kích thước, cho ĐỨC QUANG đi trước lại
      currentPlayer = startingPlayer;
      createBoard();
    });

    resetBtn.addEventListener("click", () => {
      // Reset ván hiện tại nhưng giữ tỉ số
      startingPlayer = PLAYER_X.symbol;
      currentPlayer = startingPlayer;
      createBoard();
      msgEl.textContent = "Đã bắt đầu ván mới. ĐỨC QUANG (X) đi trước.";
    });

    // Khởi tạo
    (function init() {
      createBoard();
      msgEl.textContent = "ĐỨC QUANG (X) đi trước. Hãy chọn 1 ô để bắt đầu!";
    })();
  </script>
</body>
</html>
