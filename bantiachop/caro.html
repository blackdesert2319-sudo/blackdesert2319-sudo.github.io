<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cờ ca rô – ĐỨC QUANG vs BÁ TRỰC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2933 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      transition: background 0.4s ease;
    }

    body.winner-x {
      background: radial-gradient(circle at top, #1d2a4a 0, #020617 50%, #020617 100%);
    }
    body.winner-o {
      background: radial-gradient(circle at top, #3b1637 0, #020617 50%, #020617 100%);
    }

    .game-container {
      width: min(1000px, 96vw);
      padding: 22px 24px 30px;
      border-radius: 22px;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98));
      box-shadow:
        0 26px 80px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.45);
      position: relative;
      overflow: hidden;
    }

    .game-container::before {
      content: "";
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.13) 0, transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(251, 113, 133, 0.13) 0, transparent 55%);
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.85;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: clamp(24px, 3.3vw, 30px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #facc15;
      text-shadow:
        0 0 14px rgba(250, 204, 21, 0.8),
        0 0 30px rgba(250, 204, 21, 0.9);
      position: relative;
      z-index: 1;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .control-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: radial-gradient(circle at top, #020617, #020617);
      box-shadow:
        0 0 18px rgba(15, 23, 42, 0.95),
        0 0 26px rgba(31, 41, 55, 0.9);
      border: 1px solid rgba(75, 85, 99, 0.9);
    }

    .control-panel label {
      font-size: 14px;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
      box-shadow: 0 0 12px rgba(15, 23, 42, 0.95);
    }

    button {
      padding: 6px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: radial-gradient(circle at top left, #22c55e, #15803d);
      color: #ecfeff;
      box-shadow:
        0 0 14px rgba(34, 197, 94, 0.8),
        0 0 30px rgba(21, 128, 61, 0.7);
      transition: transform 0.08s ease, box-shadow 0.1s ease, filter 0.1s ease;
      white-space: nowrap;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow:
        0 0 20px rgba(34, 197, 94, 0.98),
        0 0 40px rgba(22, 163, 74, 0.9);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    }

    .arena {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 14px;
    }

    .player {
      flex: 0 0 210px;
      padding: 16px 14px 18px;
      border-radius: 20px;
      background: radial-gradient(circle at top left, #020617, #020617 40%, #020617 100%);
      border: 1px solid rgba(55, 65, 81, 0.95);
      box-shadow:
        0 18px 30px rgba(15, 23, 42, 0.95),
        0 0 30px rgba(15, 23, 42, 0.9);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      perspective: 800px;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.2), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(251, 113, 133, 0.2), transparent 55%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      mix-blend-mode: screen;
    }

    .player.active::before {
      opacity: 0.9;
    }

    .player .name {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: clamp(18px, 2vw, 22px);
      margin-bottom: 8px;
      text-shadow:
        0 0 18px rgba(248, 250, 252, 0.9),
        0 0 26px rgba(15, 23, 42, 0.9);
    }

    #playerX .name {
      color: #38bdf8;
    }
    #playerO .name {
      color: #fb7185;
      text-align: right;
    }

    .player .symbol-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      border: 1px solid rgba(148, 163, 184, 0.75);
      background: radial-gradient(circle at top, #020617, #020617);
      text-shadow: 0 0 8px rgba(148, 163, 184, 0.9);
      box-shadow:
        0 0 16px rgba(15, 23, 42, 0.95),
        0 0 30px rgba(15, 23, 42, 0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #playerX .symbol-pill {
      border-color: #38bdf8;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
    }
    #playerO .symbol-pill {
      border-color: #fb7185;
      color: #fb7185;
      text-shadow: 0 0 10px rgba(251, 113, 133, 0.9);
    }

    .player .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #e5e7eb;
      margin-bottom: 4px;
    }

    .wins {
      font-size: 13px;
      margin-top: 2px;
      color: #9ca3af;
    }
    .wins span {
      color: #facc15;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
    }

    .player.active {
      box-shadow:
        0 18px 40px rgba(37, 99, 235, 0.8),
        0 0 40px rgba(59, 130, 246, 0.9);
      border-color: rgba(96, 165, 250, 0.95);
      animation: playerTilt 1.3s ease-in-out infinite alternate;
    }

    @keyframes playerTilt {
      0% { transform: rotateY(-5deg) translateY(0); }
      100% { transform: rotateY(4deg) translateY(-3px); }
    }

    .player.active .name {
      animation: nameBlink 0.9s linear infinite;
    }

    @keyframes nameBlink {
      0%, 100% { opacity: 1; text-shadow: 0 0 14px rgba(248, 250, 252, 0.9); }
      50% { opacity: 0.5; text-shadow: 0 0 28px rgba(248, 250, 252, 1); }
    }

    .player.win-celebrate {
      box-shadow:
        0 0 30px rgba(250, 204, 21, 0.9),
        0 0 60px rgba(250, 204, 21, 0.85);
      border-color: #facc15;
      animation: winnerPulse 1s ease-in-out infinite;
    }

    @keyframes winnerPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.03); }
    }

    .board-wrap {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
    }

    .board {
  --size: 5;
  display: grid;
  /* MỖI Ô LUÔN VUÔNG – không co dãn theo nội dung */
  grid-template-columns: repeat(var(--size), 1fr);
  grid-auto-rows: 1fr;
      gap: 5px;
      width: min(440px, 96vw);
      aspect-ratio: 1 / 1;
      padding: 14px;
      border-radius: 24px;
      background: radial-gradient(circle at top, #020617 0%, #020617 45%, #020617 100%);
      border: 2px solid rgba(55, 65, 81, 0.95);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.4),
        0 0 40px rgba(37, 99, 235, 0.5),
        0 0 80px rgba(15, 23, 42, 0.95);
      animation: boardGlow 2.8s ease-in-out infinite alternate;
    }

    @keyframes boardGlow {
      0% {
        box-shadow:
          0 0 16px rgba(56, 189, 248, 0.25),
          0 0 30px rgba(37, 99, 235, 0.35),
          0 0 60px rgba(15, 23, 42, 0.95);
      }
      100% {
        box-shadow:
          0 0 32px rgba(56, 189, 248, 0.55),
          0 0 60px rgba(37, 99, 235, 0.6),
          0 0 100px rgba(15, 23, 42, 0.95);
      }
    }

    /* ====== Ô CỜ – đã chỉnh để không “phồng / co” ====== */
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      color: #e5e7eb;
      background: radial-gradient(circle at 20% 0%, #020617 0%, #020617 30%, #020617 100%);
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      box-shadow:
        inset 0 0 0 1px rgba(55, 65, 81, 0.9),
        0 6px 14px rgba(0, 0, 0, 0.9),
        0 0 16px rgba(15, 23, 42, 1);
      transition:
        transform 0.09s ease,
        box-shadow 0.11s ease,
        background 0.12s ease,
        filter 0.12s ease;
      position: relative;
      overflow: hidden;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 10% -10%, rgba(255, 255, 255, 0.08), transparent 60%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .cell:hover {
      background: radial-gradient(circle at top, #020617 0%, #020617 50%, #020617 100%);
      transform: translateY(-1px);
      box-shadow:
        inset 0 0 0 1px rgba(148, 163, 184, 0.98),
        0 10px 20px rgba(15, 23, 42, 1),
        0 0 20px rgba(56, 189, 248, 0.4);
    }

    .cell:hover::before {
      opacity: 1;
    }

    .cell:active {
      transform: translateY(0);
      box-shadow:
        inset 0 0 0 1px rgba(75, 85, 99, 1),
        0 6px 14px rgba(0, 0, 0, 1),
        0 0 16px rgba(15, 23, 42, 1);
      filter: brightness(0.95);
    }

    .cell.X {
      color: #38bdf8;
      text-shadow:
        0 0 18px rgba(56, 189, 248, 1),
        0 0 32px rgba(56, 189, 248, 0.9);
    }

    .cell.O {
      color: #fb7185;
      text-shadow:
        0 0 18px rgba(251, 113, 133, 1),
        0 0 32px rgba(251, 113, 133, 0.9);
    }

    /* Ô đã chọn – dùng cùng độ dày shadow với ô thường, chỉ đổi màu */
    .cell.filled-x {
      background: radial-gradient(circle at top, #16a34a 0%, #15803d 45%, #052e16 100%);
      box-shadow:
        inset 0 0 0 1px rgba(187, 247, 208, 0.9),
        0 6px 14px rgba(0, 0, 0, 0.9),
        0 0 16px rgba(34, 197, 94, 0.9);
    }

    .cell.filled-o {
      background: radial-gradient(circle at top, #facc15 0%, #f97316 45%, #7c2d12 100%);
      box-shadow:
        inset 0 0 0 1px rgba(254, 249, 195, 0.95),
        0 6px 14px rgba(0, 0, 0, 0.9),
        0 0 16px rgba(251, 191, 36, 0.95);
    }

    .cell.disabled {
      pointer-events: none;
      filter: grayscale(0.5) brightness(0.85);
    }

    .cell.win-cell {
      position: relative;
      background: radial-gradient(circle at center, #f97316, #b91c1c);
      animation: winPulse 0.6s ease-in-out infinite alternate;
    }

    .cell.win-cell::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 2px solid rgba(248, 250, 252, 0.8);
      box-shadow:
        0 0 12px rgba(248, 250, 252, 0.95),
        0 0 22px rgba(251, 146, 60, 0.95);
      opacity: 0.9;
      pointer-events: none;
    }

    @keyframes winPulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.04); filter: brightness(1.15); }
    }

    .cell.blink-multi {
      animation: blinkMulti 0.42s alternate ease-in-out infinite;
    }

    @keyframes blinkMulti {
      0% {
        filter: brightness(0.6);
        box-shadow:
          inset 0 0 0 1px rgba(31, 41, 55, 0.9),
          0 6px 12px rgba(0, 0, 0, 1),
          0 0 10px rgba(15, 23, 42, 1);
      }
      100% {
        filter: brightness(1.7);
        box-shadow:
          0 0 18px var(--blink-color, rgba(250, 204, 21, 0.9)),
          0 0 32px var(--blink-color, rgba(250, 204, 21, 0.9)),
          0 0 50px rgba(15, 23, 42, 1);
      }
    }

    .board.shake {
      animation: shakeDraw 0.4s ease-in-out;
    }

    @keyframes shakeDraw {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    #message {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      min-height: 22px;
      font-size: 14px;
      text-align: center;
      color: #e5e7eb;
      text-shadow: 0 0 10px rgba(148, 163, 184, 0.8);
    }

    @media (max-width: 860px) {
      .arena {
        flex-direction: column;
        gap: 14px;
      }
      .player {
        width: 100%;
        max-width: 420px;
      }
      #playerO .name {
        text-align: left;
      }
    }

    @media (max-width: 640px) {
      .control-panel {
        border-radius: 16px;
      }
      .player {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>CỜ CA RÔ – ĐỨC QUANG vs BÁ TRỰC</h1>
    <div class="subtitle">Chọn kích thước bàn cờ, 2 người thay phiên đánh – ai chiếm đủ 3 ô thẳng hàng sẽ thắng.</div>

    <div class="control-row">
      <div class="control-panel">
        <label for="boardSize">
          Kích thước bàn cờ:
          <select id="boardSize">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5" selected>5 × 5</option>
          </select>
        </label>
        <button id="resetMatch">Chơi lại ván mới</button>
      </div>
    </div>

    <div class="arena">
      <div class="player" id="playerX">
        <div class="name">ĐỨC QUANG</div>
        <div class="info-row">
          <span>Quân:</span>
          <span class="symbol-pill">X</span>
        </div>
        <div class="wins">Ván thắng: <span id="scoreX">0</span></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <div class="player" id="playerO">
        <div class="name">BÁ TRỰC</div>
        <div class="info-row">
          <span>Quân:</span>
          <span class="symbol-pill">O</span>
        </div>
        <div class="wins">Ván thắng: <span id="scoreO">0</span></div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const PLAYER_X = { name: "ĐỨC QUANG", symbol: "X" };
    const PLAYER_O = { name: "BÁ TRỰC", symbol: "O" };
    const WIN_LENGTH = 3;

    let boardSize = 5;
    let boardState = [];
    let currentPlayer = PLAYER_X.symbol;
    let startingPlayer = PLAYER_X.symbol;
    let scores = { X: 0, O: 0 };
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const sizeSelect = document.getElementById("boardSize");
    const resetBtn = document.getElementById("resetMatch");
    const msgEl = document.getElementById("message");
    const playerXEl = document.getElementById("playerX");
    const playerOEl = document.getElementById("playerO");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq = 440, duration = 120, type = "square", volume = 0.12, startOffset = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain).connect(audioCtx.destination);
      const now = audioCtx.currentTime + startOffset;
      osc.start(now);
      osc.stop(now + duration / 1000);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);
    }

    function playClickSound() {
      playTone(620, 90, "square", 0.14);
    }

    function playVictoryMusic() {
      if (!audioCtx) return;
      const notes = [
        { f: 523, d: 160 },
        { f: 659, d: 160 },
        { f: 784, d: 180 },
        { f: 988, d: 220 },
        { f: 1047, d: 260 }
      ];
      let offset = 0;
      notes.forEach(n => {
        playTone(n.f, n.d, "triangle", 0.18, offset / 1000);
        offset += n.d - 40;
      });
      playTone(1319, 260, "sawtooth", 0.11, 0.8);
    }

    function playDrawSound() {
      playTone(320, 130, "triangle", 0.13);
      setTimeout(() => playTone(260, 110, "triangle", 0.11), 120);
    }

    function createBoard() {
      boardEl.innerHTML = "";
      boardEl.style.setProperty("--size", boardSize);
      boardState = new Array(boardSize * boardSize).fill("");

      for (let i = 0; i < boardState.length; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.index = i;
        cell.addEventListener("click", onCellClick);
        boardEl.appendChild(cell);
      }

      gameOver = false;
      boardEl.classList.remove("shake");
      playerXEl.classList.remove("win-celebrate");
      playerOEl.classList.remove("win-celebrate");
      document.body.classList.remove("winner-x", "winner-o");

      updateActivePlayerUI();
      updateMessage();
    }

    function indexToRC(index) {
      const row = Math.floor(index / boardSize);
      const col = index % boardSize;
      return { row, col };
    }

    function rcToIndex(row, col) {
      return row * boardSize + col;
    }

    function onCellClick(e) {
      if (gameOver) return;
      initAudio();

      const cell = e.currentTarget;
      const index = parseInt(cell.dataset.index, 10);
      if (boardState[index] !== "") return;

      boardState[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer);
      if (currentPlayer === PLAYER_X.symbol) {
        cell.classList.add("filled-x");
      } else {
        cell.classList.add("filled-o");
      }
      playClickSound();

      const winInfo = checkWin();
      if (winInfo) {
        handleWin(winInfo);
        return;
      }

      if (boardState.every(v => v !== "")) {
        handleDraw();
        return;
      }

      currentPlayer = currentPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
      updateActivePlayerUI();
      updateMessage();
    }

    function checkWin() {
      const size = boardSize;
      const dirs = [
        { dr: 0, dc: 1 },
        { dr: 1, dc: 0 },
        { dr: 1, dc: 1 },
        { dr: 1, dc: -1 }
      ];

      for (let index = 0; index < boardState.length; index++) {
        const symbol = boardState[index];
        if (!symbol) continue;

        const { row, col } = indexToRC(index);

        for (const { dr, dc } of dirs) {
          const line = [index];
          let ok = true;

          for (let k = 1; k < WIN_LENGTH; k++) {
            const r = row + dr * k;
            const c = col + dc * k;
            if (r < 0 || r >= size || c < 0 || c >= size) {
              ok = false;
              break;
            }
            const idx = rcToIndex(r, c);
            if (boardState[idx] !== symbol) {
              ok = false;
              break;
            }
            line.push(idx);
          }

          if (ok && line.length === WIN_LENGTH) {
            return { winner: symbol, line };
          }
        }
      }
      return null;
    }

    function disableBoard() {
      boardEl.querySelectorAll(".cell").forEach(c => c.classList.add("disabled"));
    }

    function highlightWinningCells(line) {
      const cells = boardEl.querySelectorAll(".cell");
      line.forEach(idx => cells[idx] && cells[idx].classList.add("win-cell"));
    }

    function handleWin(winInfo) {
      gameOver = true;
      disableBoard();
      highlightWinningCells(winInfo.line);

      const winnerSymbol = winInfo.winner;
      scores[winnerSymbol]++;
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;

      const winnerName = winnerSymbol === PLAYER_X.symbol ? PLAYER_X.name : PLAYER_O.name;
      msgEl.textContent = `${winnerName} thắng ván này với chuỗi 3 ô liên tiếp! 🎉`;

      if (winnerSymbol === PLAYER_X.symbol) {
        document.body.classList.add("winner-x");
        playerXEl.classList.add("win-celebrate");
        playerOEl.classList.remove("active");
      } else {
        document.body.classList.add("winner-o");
        playerOEl.classList.add("win-celebrate");
        playerXEl.classList.remove("active");
      }

      const cells = boardEl.querySelectorAll(".cell");
      const colors = [
        "rgba(56, 189, 248, 0.95)",
        "rgba(34, 197, 94, 0.95)",
        "rgba(250, 204, 21, 0.95)",
        "rgba(251, 113, 133, 0.95)",
        "rgba(129, 140, 248, 0.95)"
      ];
      cells.forEach(cell => {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const duration = 0.3 + Math.random() * 0.45;
        const delay = Math.random() * 0.35;
        cell.classList.add("blink-multi");
        cell.style.setProperty("--blink-color", color);
        cell.style.animationDuration = duration + "s";
        cell.style.animationDelay = delay + "s";
      });

      playVictoryMusic();

      setTimeout(() => {
        cells.forEach(cell => {
          cell.classList.remove("blink-multi");
          cell.style.removeProperty("--blink-color");
          cell.style.animationDuration = "";
          cell.style.animationDelay = "";
        });

        playerXEl.classList.remove("win-celebrate");
        playerOEl.classList.remove("win-celebrate");
        document.body.classList.remove("winner-x", "winner-o");

        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 4000);
    }

    function handleDraw() {
      gameOver = true;
      msgEl.textContent = "Hòa! Bàn cờ đã kín mà không ai đạt đủ 3 ô thẳng hàng. 🤝";
      playDrawSound();

      boardEl.classList.add("shake");
      disableBoard();

      setTimeout(() => {
        boardEl.classList.remove("shake");
        startingPlayer = startingPlayer === PLAYER_X.symbol ? PLAYER_O.symbol : PLAYER_X.symbol;
        currentPlayer = startingPlayer;
        createBoard();
      }, 650);
    }

    function updateActivePlayerUI() {
      playerXEl.classList.remove("active");
      playerOEl.classList.remove("active");
      (currentPlayer === PLAYER_X.symbol ? playerXEl : playerOEl).classList.add("active");
    }

    function updateMessage() {
      const playerName = currentPlayer === PLAYER_X.symbol ? PLAYER_X.name : PLAYER_O.name;
      msgEl.textContent = `Đến lượt: ${playerName} (${currentPlayer}) – hãy chọn 1 ô trống.`;
    }

    sizeSelect.addEventListener("change", () => {
      boardSize = parseInt(sizeSelect.value, 10);
      startingPlayer = PLAYER_X.symbol;
      currentPlayer = startingPlayer;
      createBoard();
    });

    resetBtn.addEventListener("click", () => {
      startingPlayer = PLAYER_X.symbol;
      currentPlayer = startingPlayer;
      createBoard();
      msgEl.textContent = "Đã bắt đầu ván mới. ĐỨC QUANG (X) đi trước.";
    });

    (function init() {
      createBoard();
      msgEl.textContent = "ĐỨC QUANG (X) đi trước. Hãy chọn 1 ô để bắt đầu!";
    })();
  </script>
</body>
</html>
